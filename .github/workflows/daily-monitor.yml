
name: Daily Pharma RFP Monitor

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pharma-rfp-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Check out repository
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Install Playwright browser and system dependencies
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # 5. Configure Google Sheets credentials
      - name: Configure Google Sheets credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT secret"
            exit 1
          fi

          mkdir -p credentials

          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" \
            > credentials/google_service_account.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("credentials/google_service_account.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  "Google service-account credentials are not valid JSON."
              ) from exc

          if not data.get("client_email") or not data.get("private_key"):
              raise SystemExit(
                  "Credentials must contain client_email and private_key."
              )

          print("Google Sheets credentials validated.")
          PY

      # 6. Validate persistent monitor state
      - name: Prepare monitor state
        run: |
          mkdir -p output logs

          if [ ! -f output/monitor_state.json ]; then
            echo "::warning::Monitor state not found; initializing new state."
            printf '{}\n' > output/monitor_state.json
          fi

          if [ ! -s output/monitor_state.json ]; then
            echo "::error::Monitor state file is empty."
            exit 1
          fi

          python -m json.tool output/monitor_state.json > /dev/null
          echo "Monitor state validated."

      # 7. Validate Google Sheets configuration
      - name: Diagnose Google Sheets configuration
        env:
          SHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          SHEET_NAME: ${{ vars.GOOGLE_SHEETS_WORKSHEET || 'Pharma RFP Monitor' }}
          CREDENTIALS_PATH: credentials/google_service_account.json
        run: |
          if [ -z "$SHEET_ID" ]; then
            echo "::error::Missing GOOGLE_SHEETS_SPREADSHEET_ID secret"
            exit 1
          fi

          if [ ! -s "$CREDENTIALS_PATH" ]; then
            echo "::error::Google Sheets credentials file is missing"
            exit 1
          fi

          echo "Google Sheets spreadsheet ID is configured."
          echo "Worksheet: $SHEET_NAME"
          echo "Credentials file is present."

      # 8. Run the Pharma RFP Monitor
      - name: Run Pharma RFP Monitor
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_WORKSHEET: ${{ vars.GOOGLE_SHEETS_WORKSHEET || 'Pharma RFP Monitor' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: credentials/google_service_account.json

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          PYTHONUNBUFFERED: "1"
        run: python diagnostic_main.py

      # 9. Verify generated outputs
      - name: Verify monitor outputs
        if: always()
        run: |
          echo "Output directory:"
          ls -la output || true

          if [ -s output/monitor_state.json ]; then
            python -m json.tool output/monitor_state.json > /dev/null
            echo "Monitor state is valid JSON."
          else
            echo "::error::Monitor state is missing or empty."
            exit 1
          fi

          test ! -f output/rfp_grant_matches.csv || \
            echo "Matches report exists."

          test ! -f output/last_run_report.csv || \
            echo "Run report exists."

      # 10. Save outputs and synchronize with latest main
      - name: Save monitor state and results
        if: success()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only generated output files.
          git add -f output/monitor_state.json

          for file in \
            output/rfp_grant_matches.csv \
            output/last_run_report.csv
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            else
              echo "Optional output not found: $file"
            fi
          done

          # Save the exact generated output snapshot.
          mkdir -p /tmp/rfp-monitor-output

          cp output/monitor_state.json \
            /tmp/rfp-monitor-output/monitor_state.json

          if [ -f output/rfp_grant_matches.csv ]; then
            cp output/rfp_grant_matches.csv \
              /tmp/rfp-monitor-output/rfp_grant_matches.csv
          fi

          if [ -f output/last_run_report.csv ]; then
            cp output/last_run_report.csv \
              /tmp/rfp-monitor-output/last_run_report.csv
          fi

          # Fetch the latest remote main before committing.
          git fetch origin main
          git reset --hard origin/main

          # Restore this run's output on top of the latest main.
          mkdir -p output

          cp /tmp/rfp-monitor-output/monitor_state.json \
            output/monitor_state.json

          for file in \
            rfp_grant_matches.csv \
            last_run_report.csv
          do
            if [ -f "/tmp/rfp-monitor-output/$file" ]; then
              cp "/tmp/rfp-monitor-output/$file" "output/$file"
            fi
          done

          git add -f output/monitor_state.json

          for file in \
            output/rfp_grant_matches.csv \
            output/last_run_report.csv
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state or report changes to commit."
            exit 0
          fi

          git commit -m "Update daily Pharma RFP Monitor results"

          # Push. Retry once if main changes concurrently.
          if ! git push origin HEAD:main; then
            echo "Push rejected; fetching latest main and retrying."

            git fetch origin main

            # Preserve this run's output files during the retry.
            cp output/monitor_state.json \
              /tmp/rfp-monitor-output/monitor_state.json

            if [ -f output/rfp_grant_matches.csv ]; then
              cp output/rfp_grant_matches.csv \
                /tmp/rfp-monitor-output/rfp_grant_matches.csv
            fi

            if [ -f output/last_run_report.csv ]; then
              cp output/last_run_report.csv \
                /tmp/rfp-monitor-output/last_run_report.csv
            fi

            git reset --hard origin/main

            mkdir -p output

            cp /tmp/rfp-monitor-output/monitor_state.json \
              output/monitor_state.json

            for file in \
              rfp_grant_matches.csv \
              last_run_report.csv
            do
              if [ -f "/tmp/rfp-monitor-output/$file" ]; then
                cp "/tmp/rfp-monitor-output/$file" "output/$file"
              fi
            done

            git add -f output/monitor_state.json

            for file in \
              output/rfp_grant_matches.csv \
              output/last_run_report.csv
            do
              if [ -f "$file" ]; then
                git add -f "$file"
              fi
            done

            if ! git diff --cached --quiet; then
              git commit -m "Update daily Pharma RFP Monitor results"
            fi

            git push origin HEAD:main
          fi

      # 11. Upload logs and reports even when earlier steps fail
      - name: Upload run logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharma-rfp-monitor-logs
          path: |
            logs/
            output/last_run_report.csv
            output/rfp_grant_matches.csv
          if-no-files-found: ignore
          retention-days: 14
